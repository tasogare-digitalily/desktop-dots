<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- CozetteVector ships without spacing=mono (it has some double-width
     glyphs), so kitty and other terminals skip it. Mark it monospace. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>CozetteVector</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
</fontconfig>
